<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- =====================================================
         FILE: sign-up.html
         PROJECT: AI Road Safety & Accident Prevention System
         PURPOSE: SafeRoad AI user registration page.
         ===================================================== -->

    <title>SafeRoad AI — Register</title>

    <!-- Shared project stylesheet. -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- =====================================================
         REGISTRATION PAGE
         Uses the same centered glass-card layout as Sign In.
         The lamp / cord scene has been removed.
         ===================================================== -->
    <main class="auth-page">

        <!-- Registration card -->
        <section class="auth-card register-card" aria-labelledby="registerTitle">

            <!-- Brand icon: same visual language as Sign In -->
            <div class="brand-mark">🛡</div>

            <!-- Registration heading -->
            <h1 id="registerTitle" align="center">Create Account</h1>

            <p align="center">Register to start your safe journey</p>

            <!-- =================================================
                 REGISTRATION FORM
                 ================================================= -->
            <form id="registerForm" novalidate>

                <!-- Full Name -->
                <div class="register-field">
                    <label for="fullName">Full Name</label>
                    <input
                        id="fullName"
                        name="fullName"
                        type="text"
                        autocomplete="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <!-- Age -->
                <div class="register-field">
                    <label for="age">Age</label>
                    <input
                        id="age"
                        name="age"
                        type="number"
                        min="1"
                        max="120"
                        placeholder="Enter your age"
                        required
                    >
                </div>

                <!-- Mobile Number + OTP -->
                <div class="register-field">
                    <label for="mobile">Mobile Number</label>

                    <div class="verification-row">
                        <input
                            id="mobile"
                            name="mobile"
                            type="tel"
                            maxlength="10"
                            inputmode="numeric"
                            autocomplete="tel"
                            placeholder="Enter 10-digit mobile number"
                            required
                        >

                        <button
                            class="verify"
                            id="otpBtn"
                            type="button"
                        >
                            Send OTP
                        </button>
                    </div>
                </div>

                <!-- Mobile OTP -->
                <div class="register-field">
                    <label for="otp">OTP</label>

                    <div class="verification-row">
                        <input
                            id="otp"
                            name="otp"
                            type="text"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            placeholder="Enter OTP"
                            required
                        >

                        <button
                            class="verify"
                            id="verifyBtn"
                            type="button"
                        >
                            Verify OTP
                        </button>
                    </div>
                </div>

                <!-- Email Address + Verification Code -->
                <div class="register-field">
                    <label for="email">Email Address</label>

                    <div class="verification-row">
                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="Enter your email address"
                            required
                        >

                        <button
                            class="verify"
                            id="emailOtpBtn"
                            type="button"
                        >
                            Send Verification Code
                        </button>
                    </div>
                </div>

                <!-- Email Verification Code -->
                <div class="register-field">
                    <label for="emailOtp">Email Verification Code</label>

                    <div class="verification-row">
                        <input
                            id="emailOtp"
                            name="emailOtp"
                            type="text"
                            maxlength="6"
                            inputmode="numeric"
                            placeholder="Enter email verification code"
                            required
                        >

                        <button
                            class="verify"
                            id="emailVerifyBtn"
                            type="button"
                        >
                            Verify Email
                        </button>
                    </div>
                </div>

                <!-- Password -->
                <div class="register-field">
                    <label for="password">Enter Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <!-- Confirm Password -->
                <div class="register-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <!-- Captcha -->
                <div class="register-field">
                    <label for="captchaInput">Captcha</label>

                    <div class="captcha-row">
                        <!-- Generated captcha value -->
                        <div
                            class="captcha-box"
                            id="captchaBox"
                            aria-label="Generated captcha"
                        ></div>

                        <!-- Captcha refresh button -->
                        <button
                            class="refresh"
                            id="refreshCaptcha"
                            type="button"
                            title="Refresh Captcha"
                            aria-label="Refresh Captcha"
                        >
                            ↻
                        </button>
                    </div>

                    <input
                        id="captchaInput"
                        name="captchaInput"
                        type="text"
                        maxlength="6"
                        autocomplete="off"
                        placeholder="Enter captcha"
                        required
                    >
                </div>

                <!-- Registration status message -->
                <div
                    class="message"
                    id="message"
                    role="status"
                    aria-live="polite"
                ></div>

                <!-- Register button -->
                <button
                    class="primary-large register-submit"
                    id="registerBtn"
                    type="submit"
                >
                    Register →
                </button>

            </form>

            <!-- Login navigation -->
            <div class="auth-links">
                <span>Already registered?</span>
                <a href="sign-in.html">Sign In</a>
            </div>

            <!-- Dashboard navigation -->
            <a
                class="back-link"
                href="../index.html"
            >
                ← Back to Dashboard
            </a>

        </section>

    </main>

    <!-- Registration validation, OTP and captcha logic. -->
    <script src="../js/register.js"></script>

</body>

</html>
